name: Lint and SAST

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pin)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pin)
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pin)
      - name: Semgrep scan
        run: semgrep scan --config p/javascript --config p/owasp-top-ten --error --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-domain --exclude-rule javascript.express.security.audit.express-cookie-settings.express-cookie-session-no-path --exclude-rule html.security.plaintext-http-link.plaintext-http-link